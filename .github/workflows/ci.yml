name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        # The slim ffmpeg formula has no libass. ffmpeg-full is keg-only:
        # wecut finds it by itself, the tests' fixture builder needs PATH.
        run: |
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
        shell: bash
      - run: go test ./...
      - run: go run ./cmd/wecut doctor
      - run: node --check npm/wecut/bin/wecut.js
      - run: node --check studio/app.mjs
      - run: node --check studio/timeline.mjs
      - run: node --check studio/clone.mjs
      - name: Browser clone engine (WebAssembly) builds and runs
        run: |
          go run ./tools/wasm
          node --test studio/clone.test.mjs
      - run: node --test studio/model.test.mjs studio/editing.test.mjs
      - name: Studio template interoperability
        shell: bash
        run: |
          go build -o studio-test-engine.exe ./cmd/wecut
          node studio/check-engine.mjs ./studio-test-engine.exe
      - name: Release build still works
        if: runner.os == 'Linux'
        run: go run ./tools/release -version 0.0.0-ci
